<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<title>Немає з'єднання — Малеча</title>
<style>
  /* Самодостатня сторінка: без мережі стилі застосунку можуть бути недоступні. */
  :root{--ink:#20312d;--muted:#899691;--line:#e7ece9;--bg:#f5f7f6;--accent:#168a72}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px 16px}
  main{max-width:360px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 24px}
  img{width:56px;height:56px}
  h1{font-size:20px;margin:16px 0 8px}
  p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 22px}
  button{height:44px;padding:0 22px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button:focus-visible{outline:3px solid #5eaf99;outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Немає з'єднання з інтернетом</h1>
  <p>Малеча працює лише онлайн, щоб дані про дітей і оплати завжди були актуальні. Перевірте мережу і спробуйте ще раз.</p>
  <button type="button" onclick="location.reload()">Спробувати ще раз</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
