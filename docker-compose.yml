services:
  postgres:
    image: postgres:17-alpine
    container_name: malecha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: malecha
      POSTGRES_USER: malecha
      POSTGRES_PASSWORD: malecha_local
    ports:
      - "5433:5432"
    volumes:
      - malecha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malecha -d malecha"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  malecha_postgres_data:
